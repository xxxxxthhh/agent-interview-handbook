<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="按动作可逆性与影响范围决定放行方式的矩阵">
  <!-- 列标题 -->
  <text x="300" y="26" class="lbl" text-anchor="middle">只影响用户自己</text>
  <text x="300" y="44" class="sub" text-anchor="middle">自己的草稿、提醒、个人日程</text>
  <text x="590" y="26" class="lbl" text-anchor="middle">对他人可见 / 对外发出 / 敏感数据</text>
  <text x="590" y="44" class="sub" text-anchor="middle">发邮件、共享文件、接受会议邀请（应答对组织者可见）</text>

  <!-- 行标题 -->
  <text x="22" y="116" class="lbl">可撤销</text>
  <text x="22" y="134" class="sub">能在事后恢复</text>
  <text x="22" y="226" class="lbl">不可撤销</text>
  <text x="22" y="244" class="sub">发出去就收不回</text>

  <!-- 四格 -->
  <rect x="160" y="62" width="280" height="100" rx="8" fill="var(--alloc-soft)" stroke="var(--alloc)"/>
  <text x="178" y="90" class="lbl">自动执行，可撤销</text>
  <text x="178" y="112" class="sub">例：把回复存成草稿、给自己加提醒</text>
  <text x="178" y="132" class="mn">留痕 · 一键撤销 · 不打断用户</text>

  <rect x="450" y="62" width="280" height="100" rx="8" fill="var(--card)" stroke="var(--alloc)" stroke-width="2"/>
  <text x="468" y="90" class="lbl">执行前确认</text>
  <text x="468" y="112" class="sub">例：接受内部会议邀请、改期自己组织的会</text>
  <text x="468" y="132" class="mn">确认框展示具体参数与触发来源</text>

  <rect x="160" y="172" width="280" height="100" rx="8" fill="var(--card)" stroke="var(--alloc)" stroke-width="2"/>
  <text x="178" y="200" class="lbl">执行前确认</text>
  <text x="178" y="222" class="sub">例：永久删除一批自己的邮件</text>
  <text x="178" y="242" class="mn">展示影响范围，默认按钮是「取消」</text>

  <rect x="450" y="172" width="280" height="100" rx="8" fill="var(--waste-soft)" stroke="var(--waste)" stroke-width="2.5"/>
  <text x="468" y="200" class="lbl">人审或双人确认</text>
  <text x="468" y="222" class="sub">例：对外发送带敏感附件的邮件</text>
  <text x="468" y="242" class="mn">收件人域与数据分级由执行端硬校验</text>

  <!-- 禁止带 -->
  <rect x="160" y="286" width="570" height="46" rx="8" fill="var(--head-bg)"/>
  <text x="178" y="314" class="lbl" style="fill:var(--head-fg)">超出用户本人权限 → 禁止</text>
  <text x="712" y="314" class="onfill" text-anchor="end" style="fill:var(--head-fg)">不因用户或模型的要求而放开</text>

  <!-- 升级规则 -->
  <text x="160" y="366" class="mn">↑ 本会话读过不可信内容（外部邮件、网页、附件）后：对外发送不再自动，收件人限定在已知名单</text>
  <text x="160" y="386" class="mn">↑ 从邮件或附件抽出的收件人、金额等只是候选值：带来源和校验状态，由执行端验证、用户看原件确认</text>
  <text x="160" y="410" class="mn">¥ 钱类动作不在此表：按业务政策与金额阈值定（用户确认 / 审核人批准 / 禁止）</text>
  <text x="22" y="26" class="mn">本助理默认策略</text>
</svg>
