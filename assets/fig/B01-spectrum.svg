<svg viewBox="0 0 560 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="编排形态的两条轴：子任务怎么拆由谁决定，是否委派给能自主处理子任务的 worker">
  <defs>
    <marker id="b01-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink-soft)"/>
    </marker>
  </defs>

  <!-- 四个区域：左 = 代码拆子任务，右 = 模型拆子任务 / 定下一步；上 = 委派给自主 worker，下 = 不委派 -->
  <rect x="60" y="20" width="240" height="185" fill="var(--alloc-soft)" opacity=".45"/>
  <rect x="60" y="205" width="240" height="185" fill="var(--alloc-soft)" opacity=".9"/>
  <rect x="300" y="20" width="240" height="185" fill="var(--waste-soft)" opacity=".95"/>
  <rect x="300" y="205" width="240" height="185" fill="var(--waste-soft)" opacity=".5"/>
  <line x1="300" y1="20" x2="300" y2="390" stroke="var(--ink-soft)" stroke-dasharray="5 4"/>
  <line x1="60" y1="205" x2="540" y2="205" stroke="var(--ink-soft)" stroke-dasharray="5 4"/>

  <!-- 轴 -->
  <line x1="60" y1="390" x2="546" y2="390" stroke="var(--ink-soft)" stroke-width="2" marker-end="url(#b01-arr)"/>
  <line x1="60" y1="390" x2="60" y2="14" stroke="var(--ink-soft)" stroke-width="2" marker-end="url(#b01-arr)"/>
  <text x="180" y="414" class="lbl" text-anchor="middle" style="font-size:16px">代码拆子任务</text>
  <text x="420" y="414" class="lbl" text-anchor="middle" style="font-size:16px">模型拆子任务</text>
  <text x="300" y="438" class="sub" text-anchor="middle" style="font-size:14.5px">横轴：子任务怎么拆、下一步做什么，由谁决定</text>
  <text x="40" y="298" class="lbl" text-anchor="middle" style="font-size:16px" transform="rotate(-90 40 298)">不委派</text>
  <text x="40" y="112" class="lbl" text-anchor="middle" style="font-size:16px" transform="rotate(-90 40 112)">委派给自主 worker</text>

  <!-- 左上：代码定子任务 · 自主 worker -->
  <circle cx="84" cy="46" r="7" fill="var(--card)" stroke="var(--waste)" stroke-width="2.5"/>
  <text x="98" y="51" class="lbl" style="font-size:16.5px">固定大纲内的子 Agent</text>
  <text x="98" y="73" class="sub" style="font-size:14.5px">代码定子任务，</text>
  <text x="98" y="92" class="sub" style="font-size:14.5px">worker 自己决定怎么查</text>

  <!-- 右上：模型拆分 · 自主 worker -->
  <circle cx="330" cy="46" r="7" fill="var(--waste)"/>
  <text x="344" y="51" class="lbl" style="font-size:16.5px">多个自主 Agent</text>
  <text x="344" y="73" class="sub" style="font-size:14.5px">模型拆分，worker 各自循环</text>

  <!-- 跨界：Orchestrator-workers -->
  <rect x="186" y="118" width="228" height="64" rx="8" fill="var(--card)" stroke="var(--waste)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="300" y="143" class="lbl" text-anchor="middle" style="font-size:16.5px">Orchestrator-workers</text>
  <text x="300" y="167" class="sub" text-anchor="middle" style="font-size:14.5px">代码定委派骨架，模型定子任务</text>

  <!-- 左下：代码拆解 · 不委派（这四种不规定上下文是否共享） -->
  <circle cx="84" cy="236" r="7" fill="var(--card)" stroke="var(--alloc)" stroke-width="2.5"/>
  <text x="98" y="241" class="lbl" style="font-size:16.5px">Prompt chaining</text>
  <circle cx="84" cy="270" r="7" fill="var(--card)" stroke="var(--alloc)" stroke-width="2.5"/>
  <text x="98" y="275" class="lbl" style="font-size:16.5px">Routing</text>
  <circle cx="84" cy="304" r="7" fill="var(--card)" stroke="var(--alloc)" stroke-width="2.5"/>
  <text x="98" y="309" class="lbl" style="font-size:16.5px">Evaluator-optimizer</text>
  <circle cx="84" cy="338" r="7" fill="var(--card)" stroke="var(--alloc)" stroke-width="2.5"/>
  <text x="98" y="343" class="lbl" style="font-size:16.5px">Parallelization</text>
  <text x="98" y="365" class="sub" style="font-size:14.5px">40 条目分片：多次独立调用</text>

  <!-- 右下：模型定下一步 · 不委派 -->
  <circle cx="330" cy="270" r="7" fill="var(--waste)"/>
  <text x="344" y="275" class="lbl" style="font-size:16.5px">单 Agent 循环</text>
  <text x="344" y="297" class="sub" style="font-size:14.5px">模型定下一步，自己做完</text>

  <text x="60" y="466" class="mn" style="font-size:13px">顶层骨架（先做什么、何时汇总）常常仍由代码预设，横轴只看子任务这一层。</text>
  <text x="60" y="488" class="mn" style="font-size:13px">上下文共享还是隔离是另一项实现选择，图中不表示。</text>
</svg>
